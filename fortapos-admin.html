      allow create: if request.auth != null || true;

    }

    // Koleksi Riwayat Audit Aktivitas Lisensi

    }

    // Pengaturan Global & Kontrol Harga Paket SaaS
    match /settings/{document=**} {
      allow read, write: if true;
    }
  }
}`;

        const savedCustom = localStorage.getItem('fortapos_custom_firebase_config');
        if (savedCustom) {
          try {
            const parsed = JSON.parse(savedCustom);
            if (parsed && parsed.apiKey && parsed.projectId) return parsed;

            console.warn("Custom config parsing error:", e);

        return DEFAULT_FIREBASE_CONFIG;

        basic_30: 150000,
        basic_90: 400000,
        basic_365: 1500000,
        premium_30: 250000,

      };

        const saved = localStorage.getItem('fortapos_packages_pricing_v2');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (parsed && typeof parsed === 'object') {
              return { ...DEFAULT_PRICING, ...parsed };
            }
          } catch (e) {}
        }
        return DEFAULT_PRICING;
      });

      const [logFilterRole, setLogFilterRole] = useState('all');

                state: 'connected',
                message: `Firestore: ${firebaseConfig.projectId}`

          // 1. MONITORING REAL-TIME OWNER: onSnapshot ke collection /stores
          unsubscribeStores = firestore.collection('stores')
            .onSnapshot(
              (snapshot) => {
                const storeList = [];
                snapshot.forEach((docSnap) => {
                  const data = docSnap.data();
                  storeList.push({
                    id: docSnap.id,
                    storeId: data.storeId || docSnap.id,
                    storeName: data.storeName || data.name || 'Toko Tanpa Nama',

                    address: data.address || '-',
                    license: data.license || null,
                    activeDeviceId: data.currentActiveDevice || data.activeDeviceId || '',
                    activeDeviceLastSeen: data.activeDeviceLastSeen || data.lastActiveTime || data.updatedAt || null,
                    lastActiveAction: data.lastActiveAction || data.lastAction || 'Standby kasir',
                    createdAt: data.createdAt || null,
                    raw: data
                  });
                });

                // Urutkan toko berdasarkan yang paling baru aktif
                storeList.sort((a, b) => {
                  const getMs = (s) => {
                    const raw = s.activeDeviceLastSeen || s.createdAt;
                    if (!raw) return 0;
                    if (typeof raw.toDate === 'function') return raw.toDate().getTime();
                    const d = new Date(raw).getTime();
                    return isNaN(d) ? 0 : d;
                  };
                  return getMs(b) - getMs(a);

                setStores(storeList);
                setIsLoadingStores(false);
              },
              (err) => {
                console.warn("Stores onSnapshot error:", err);
                setIsLoadingStores(false);
              }
            );

          // 2. onSnapshot ke collection /licenses
          unsubscribeLicenses = firestore.collection('licenses')
            .onSnapshot(
              (snapshot) => {
                const items = [];
                snapshot.forEach((docSnap) => {
                  const data = docSnap.data();
                  const code = data.code || data.licenseCode || docSnap.id;
                  const pkg = data.packageType || (code.startsWith('PREM') ? 'premium' : 'basic');
                  const dur = Number(data.durationDays) || 30;
                  const isUsed = Boolean(data.isUsed || (data.status && data.status !== 'unused'));
                  const status = data.status || (isUsed ? 'active' : 'unused');
                  const usedByStoreId = data.usedByStoreId || '';

                  items.push({
                    id: docSnap.id,
                    code,
                    packageType: pkg,
                    durationDays: dur,
                    isUsed,
                    status,
                    usedByStoreId,
                    activationStart: data.activationStart || null,
                    activationEnd: data.activationEnd || null,
                    createdAt: data.createdAt,
                    activatedAt: data.activatedAt || null,
                    expiresAt: data.expiresAt || null
                  });
                });

                items.sort((a, b) => getTimeNumber(b.createdAt) - getTimeNumber(a.createdAt));
                setLicenses(items);
                setIsLoadingLicenses(false);

              (err) => {
                console.warn("Licenses onSnapshot error:", err);
                setIsLoadingLicenses(false);

            );

          // 3. onSnapshot ke collection /logs (Audit Trail)
          unsubscribeLogs = firestore.collection('logs')
            .onSnapshot(

            state: 'error',

        return () => {

          if (unsubscribeLogs) unsubscribeLogs();
          if (unsubscribePricing) unsubscribePricing();
          if (unsubscribeAuth) unsubscribeAuth();
        };
      }, [firebaseConfig]);

      const getTimeNumber = (val) => {
        if (!val) return 0;
        if (typeof val === 'number') return val;
        if (typeof val.toDate === 'function') return val.toDate().getTime();
        if (val.seconds) return val.seconds * 1000;
        const d = new Date(val);
        return isNaN(d.getTime()) ? 0 : d.getTime();
      };

      // ==============================================================
      // PERHITUNGAN STATUS ONLINE / OFFLINE (Batas: 5 Menit)
      // ==============================================================
      const checkDeviceOnlineStatus = (store) => {
        const lastSeen = store.activeDeviceLastSeen || store.lastActiveTime;
        if (!lastSeen) {
          return { isOnline: false, text: "OFF / Offline", timeAgo: "Belum pernah aktif", diffMinutes: 999999 };
        }
        let lastMs = 0;
        if (typeof lastSeen.toDate === 'function') {
          lastMs = lastSeen.toDate().getTime();
        } else if (lastSeen.seconds) {
          lastMs = lastSeen.seconds * 1000;
        } else {
          lastMs = new Date(lastSeen).getTime();
        }
        if (isNaN(lastMs)) {
          return { isOnline: false, text: "OFF / Offline", timeAgo: "-", diffMinutes: 999999 };
        }

        const diffMs = Date.now() - lastMs;
        const diffMinutes = Math.floor(diffMs / 60000);
        const isOnline = diffMinutes < 5; // KURANG DARI 5 MENIT = ONLINE NYALA!

        let timeAgo = '';
        if (diffMinutes < 1) timeAgo = 'Baru saja';
        else if (diffMinutes < 60) timeAgo = `${diffMinutes} mnt lalu`;
        else if (diffMinutes < 1440) timeAgo = `${Math.floor(diffMinutes / 60)} jam lalu`;
        else timeAgo = `${Math.floor(diffMinutes / 1440)} hari lalu`;

        return {
          isOnline,
          text: isOnline ? "ON / Online" : "OFF / Offline",
          timeAgo,
          diffMinutes
        };
      };

      // Helper Log Aktivitas
      const logActivity = async (entry) => {
        if (!db) return;
        try {
          await db.collection('logs').add({
            ...entry,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });
        } catch (e) {
          console.warn("Log activity error:", e);
        }
      };

      // Handler Login Gate
      const handleLoginSubmit = async (e) => {
        e.preventDefault();
        setLoginError(null);

          setLoginError('Firebase Auth belum siap. Periksa konfigurasi Firebase.');
          return;
        }
        setIsLoggingIn(true);
        try {
          const cred = await auth.signInWithEmailAndPassword(loginEmail.trim(), loginPassword);
          showToast(`Berhasil login sebagai ${cred.user.email}!`);
          setLoginEmail('');
          setLoginPassword('');
        } catch (err) {
          console.error("Login gate error:", err);
          let msg = err.message || 'Login gagal. Periksa kembali email dan password.';
          if (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
            msg = 'Password yang Anda masukkan salah!';
          } else if (err.code === 'auth/user-not-found') {
            msg = 'Akun email pengembang tidak terdaftar di Firebase Authentication!';
          } else if (err.code === 'auth/invalid-email') {
            msg = 'Format alamat email tidak valid.';
          } else if (err.code === 'auth/too-many-requests') {
            msg = 'Terlalu banyak percobaan gagal. Silakan coba beberapa saat lagi.';
          }
          setLoginError(msg);
        } finally {
          setIsLoggingIn(false);
        }
      };

      // Handler Logout
      const handleLogout = async () => {

        try {
          await auth.signOut();

          showToast('Sesi akun berhasil dikeluarkan (Logout).');

          showToast(`Logout gagal: ${err.message}`);

      };

      // Generator Kode Lisensi Unik
      function generateLicenseCode(pkg) {
        const prefix = (pkg === 'premium') ? 'PREM' : 'BASE';
        const getBlock = () => {
          let b = '';
          for (let i = 0; i < 4; i++) {
            b += ALLOWED_CHARS[Math.floor(Math.random() * ALLOWED_CHARS.length)];
          }
          return b;
        };
        return `${prefix}-${getBlock()}-${getBlock()}-${getBlock()}`;
      }

      // Handler Generate & Simpan Voucher Baru ke /licenses
      const handleGenerateLicense = async (e) => {
        e.preventDefault();
        setIsGenerating(true);

        const performer = currentUser ? currentUser.email : 'Developer (Admin)';
        const newCodes = [];

        try {
          if (!db) throw new Error("Koneksi Firestore belum siap.");
          const batch = db.batch();

          for (let i = 0; i < quantity; i++) {
            const voucherCode = generateLicenseCode(packageType);
            const now = new Date();
            const activationStart = now.toISOString();
            const activationEnd = new Date(now.getTime() + durationDays * 24 * 60 * 60 * 1000).toISOString();

            const docRef = db.collection('licenses').doc(voucherCode);
            const docData = {
              code: voucherCode,
              licenseCode: voucherCode,
              packageType: packageType,
              packageName: packageType === 'premium' ? 'Paket Premium' : 'Paket Basic',
              durationDays: Number(durationDays),

              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
              usedByStoreId: "",
              activatedAt: null,
              expiresAt: null
            };

            batch.set(docRef, docData);
            newCodes.push(voucherCode);

          await batch.commit();

          // Catat ke log audit
          for (const code of newCodes) {
            await logActivity({
              action: 'GENERATE',
              licenseCode: code,
              packageType,
              durationDays,
              performedBy: performer,
              performedByRole: 'developer',

      // Format Mata Uang Rupiah (IDR)

        return new Intl.NumberFormat('id-ID', {
          style: 'currency',
          currency: 'IDR',
          minimumFractionDigits: 0,
          maximumFractionDigits: 0
        }).format(num);
      };

      // Format Tanggal
      const formatDate = (raw) => {
        if (!raw) return '-';
        let d = null;
        if (typeof raw.toDate === 'function') d = raw.toDate();
        else if (raw.seconds) d = new Date(raw.seconds * 1000);
        else d = new Date(raw);
        if (!d || isNaN(d.getTime())) return String(raw);
        return d.toLocaleDateString('id-ID', {
          day: '2-digit',
          month: 'short',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
      };

      // Salin Teks ke Clipboard
      const copyToClipboard = (text, msg) => {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(
            () => showToast(msg),
            () => fallbackCopyText(text, msg)
          );
        } else {
          fallbackCopyText(text, msg);
        }
      };

      const fallbackCopyText = (text, msg) => {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.left = "-999999px";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
          document.execCommand('copy');
          showToast(msg);
        } catch (err) {
          showToast('Gagal menyalin teks');

        document.body.removeChild(textArea);

      // Handler Simpan Custom Firebase Config
      const handleSaveCustomConfig = (e) => {

            apiKey: (configForm.apiKey || '').trim(),

      // Handler Reset Custom Config ke Default

            !q ||
            (s.storeName && s.storeName.toLowerCase().includes(q)) ||
            (s.ownerName && s.ownerName.toLowerCase().includes(q)) ||
            (s.email && s.email.toLowerCase().includes(q)) ||
            (s.storeId && s.storeId.toLowerCase().includes(q)) ||
            (s.phone && s.phone.toLowerCase().includes(q));

          const statusInfo = checkDeviceOnlineStatus(s);
          const matchStatus =
            storeFilterStatus === 'all' ||
            (storeFilterStatus === 'online' && statusInfo.isOnline) ||
            (storeFilterStatus === 'offline' && !statusInfo.isOnline);

          const pkgType = (s.license && s.license.packageType ? s.license.packageType : (s.license && s.license.isTrial ? 'trial' : 'none')).toLowerCase();
          const matchPackage =
            storeFilterPackage === 'all' ||
            (storeFilterPackage === 'premium' && pkgType === 'premium') ||
            (storeFilterPackage === 'basic' && pkgType === 'basic') ||
            (storeFilterPackage === 'trial' && (pkgType === 'trial' || (s.license && s.license.status === 'trial')));

          return matchQuery && matchStatus && matchPackage;
        });
      }, [stores, storeSearchQuery, storeFilterStatus, storeFilterPackage]);

          else if (pkg === 'basic') basicCount++;
        });

        return {
          total: stores.length,
          onlineCount,
          offlineCount: stores.length - onlineCount,
          premiumCount,
          basicCount
        };
      }, [stores]);

      // Filtered Licenses
      const filteredLicenses = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();

            !q ||
            (item.code && item.code.toLowerCase().includes(q)) ||
            (item.usedByStoreId && item.usedByStoreId.toLowerCase().includes(q));

          const matchPackage = filterPackage === 'all' || item.packageType === filterPackage;

            filterStatus === 'all' ||
            (filterStatus === 'available' ? !item.isUsed : item.isUsed);
          const matchDuration =
            filterDuration === 'all' || String(item.durationDays) === filterDuration;

          return matchQuery && matchPackage && matchStatus && matchDuration;
        });
      }, [licenses, searchQuery, filterPackage, filterStatus, filterDuration]);

      // Metrics Licenses

        let available = 0;
        let used = 0;
        let premium = 0;
        let basic = 0;

        licenses.forEach((item) => {
          if (item.isUsed) used++;
          else available++;
          if (item.packageType === 'premium') premium++;
          else basic++;
        });

        return { total: licenses.length, available, used, premium, basic };
      }, [licenses]);

      // Filtered Activity Logs
      const filteredActivityLogs = useMemo(() => {
        const q = logSearchQuery.trim().toLowerCase();
        return activityLogs.filter((log) => {
          const matchQuery =
            !q ||
            (log.licenseCode && log.licenseCode.toLowerCase().includes(q)) ||

            (log.details && log.details.toLowerCase().includes(q));

          const matchAction = logFilterAction === 'all' || log.action === logFilterAction;
          const matchRole = logFilterRole === 'all' || log.performedByRole === logFilterRole;

          return matchQuery && matchAction && matchRole;
        });
      }, [activityLogs, logSearchQuery, logFilterAction, logFilterRole]);

      // Message WhatsApp Generator
      const getWhatsAppMessage = (item) => {
        if (!item) return '';
        const pkgName =
          item.packageType === 'premium'
            ? 'PREMIUM (Akses Multi-Kasir, Backup Cloud Harian & Fitur Lengkap)'

          item.durationDays === 365
            ? '365 Hari (1 Tahun)'
            : item.durationDays === 90
            ? '90 Hari (3 Bulan)'
            : '30 Hari (1 Bulan)';

        return `*KODE AKTIVASI LISENSI RESMI FORTAPOS-MD*

Halo Pemilik Toko,

Berikut adalah voucher lisensi resmi aplikasi kasir FortaPOS Anda:

*Kode Lisensi:* \`${item.code}\`
*Paket:* ${pkgName}
*Durasi Masa Aktif:* ${durName}
*Status:* Siap Diaktivasi di Perangkat Kasir

*Panduan Aktivasi:*
1. Buka aplikasi kasir FortaPOS Anda.
2. Masuk ke tab Pengaturan Toko > Registrasi Paket & Lisensi.
3. Masukkan kode lisensi \`${item.code}\` pada kolom Aktivasi Kode Lisensi.

                              </td>
                              <td className="py-2.5 px-4 text-slate-700 dark:text-slate-300 font-mono text-[11px]">
                                {log.performedBy}
                              </td>
                              <td className="py-2.5 px-4 text-slate-600 dark:text-slate-400">
                                {log.details}
                              </td>
                            </tr>
                          ))
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* MODAL DETAIL TOKO */}
          {showStoreDetailModal && selectedStoreDetail && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-brand-surface border border-slate-200 dark:border-brand-border rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-slate-200 dark:border-brand-border pb-3">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-2xl bg-emerald-100 dark:bg-emerald-950/80 text-emerald-600 dark:text-emerald-400 flex items-center justify-center font-bold">
                      <IconStore className="w-5 h-5" />
                    </div>
                    <div>
                      <h3 className="font-extrabold text-base text-slate-900 dark:text-white">
                        {selectedStoreDetail.storeName}
                      </h3>
                      <p className="text-xs text-slate-400 font-mono">Store ID: {selectedStoreDetail.storeId}</p>
                    </div>
                  </div>
                  <button
                    onClick={() => setShowStoreDetailModal(false)}
                    className="p-1 rounded-lg text-slate-400 hover:text-white cursor-pointer"
                  >
                    <IconX className="w-5 h-5" />
                  </button>
                </div>

                <div className="space-y-3 text-xs">
                  <div className="grid grid-cols-2 gap-3 p-3 bg-slate-50 dark:bg-brand-surface2 rounded-xl">
                    <div>
                      <span className="text-slate-400 block text-[10px]">Owner Toko:</span>
                      <strong className="text-slate-800 dark:text-white">{selectedStoreDetail.ownerName}</strong>
                    </div>
                    <div>
                      <span className="text-slate-400 block text-[10px]">Email Owner:</span>
                      <strong className="text-slate-800 dark:text-white font-mono">{selectedStoreDetail.email}</strong>
                    </div>
                    <div>
                      <span className="text-slate-400 block text-[10px]">Telepon / WA:</span>
                      <strong className="text-slate-800 dark:text-white font-mono">{selectedStoreDetail.phone}</strong>
                    </div>
                    <div>
                      <span className="text-slate-400 block text-[10px]">Alamat:</span>
                      <span className="text-slate-700 dark:text-slate-300">{selectedStoreDetail.address}</span>
                    </div>
                  </div>

                  <div className="p-3 bg-slate-50 dark:bg-brand-surface2 rounded-xl space-y-1.5">
                    <span className="text-slate-400 block text-[10px] uppercase font-bold tracking-wider">Informasi Lisensi</span>
                    {selectedStoreDetail.license ? (
                      <div className="space-y-1">
                        <div className="flex justify-between">
                          <span className="text-slate-500">Paket:</span>
                          <strong className="text-emerald-600 dark:text-emerald-400 font-bold">{selectedStoreDetail.license.packageName || selectedStoreDetail.license.packageType}</strong>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-slate-500">Kode Lisensi:</span>
                          <code className="font-mono text-slate-700 dark:text-slate-300">{selectedStoreDetail.license.code || '-'}</code>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-slate-500">Mulai:</span>
                          <span>{formatDate(selectedStoreDetail.license.activatedAt)}</span>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-slate-500">Kedaluwarsa:</span>
                          <span className="font-mono font-bold text-amber-500">{formatDate(selectedStoreDetail.license.expiresAt)}</span>
                        </div>
                      </div>
                    ) : (
                      <span className="text-slate-400 italic">Belum ada lisensi aktif terikat.</span>
                    )}
                  </div>

                  <div className="p-3 bg-slate-50 dark:bg-brand-surface2 rounded-xl space-y-1">
                    <span className="text-slate-400 block text-[10px] uppercase font-bold tracking-wider">Perangkat &amp; Sesi Aktif</span>
                    <div className="flex justify-between items-center">
                      <span className="text-slate-500">Device ID:</span>
                      <code className="font-mono text-[11px] text-slate-800 dark:text-slate-200">
                        {selectedStoreDetail.activeDeviceId || 'Tidak ada perangkat'}
                      </code>
                    </div>
                    <div className="flex justify-between items-center">
                      <span className="text-slate-500">Terakhir Aktif:</span>
                      <span>{selectedStoreDetail.activeDeviceLastSeen ? formatDate(selectedStoreDetail.activeDeviceLastSeen) : '-'}</span>
                    </div>
                    <div className="flex justify-between items-center">
                      <span className="text-slate-500">Aksi Terakhir:</span>
                      <span className="font-medium text-emerald-600 dark:text-emerald-400">{selectedStoreDetail.lastActiveAction}</span>
                    </div>
                  </div>
                </div>

                <div className="pt-2 border-t border-slate-200 dark:border-brand-border flex items-center justify-end gap-2">
                  <button
                    type="button"
                    onClick={() => setShowStoreDetailModal(false)}
                    className="px-4 py-2 rounded-xl bg-slate-100 dark:bg-brand-surface2 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 text-xs font-bold cursor-pointer"
                  >
                    Tutup
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL CONFIG FIREBASE (Dapat dibuka kapan saja oleh Admin) */}
          {showConfigModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-brand-surface border border-slate-200 dark:border-brand-border rounded-2xl max-w-xl w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-slate-200 dark:border-brand-border pb-3">
                  <div className="flex items-center gap-2">
                    <IconSettings className="w-5 h-5 text-emerald-500" />
                    <h3 className="text-sm font-bold text-slate-900 dark:text-white">
                      Konfigurasi Akun Firebase Cloud Firestore
                    </h3>
                  </div>
                  <button
                    onClick={() => setShowConfigModal(false)}
                    className="text-slate-400 hover:text-slate-600 dark:hover:text-white p-1 rounded-lg cursor-pointer"
                  >
                    <IconX className="w-5 h-5" />
                  </button>
                </div>

                <p className="text-xs text-slate-600 dark:text-slate-300">
                  Panel admin dapat dialihkan ke akun Firebase pengembang lainnya secara dinamis. Konfigurasi kustom disimpan di <code className="font-mono text-emerald-600 dark:text-emerald-400">localStorage</code> browser Anda.
                </p>

                <form onSubmit={handleSaveCustomConfig} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-700 dark:text-slate-300 font-semibold mb-1">API Key (apiKey)</label>
                    <input
                      type="text"
                      required
                      value={configForm.apiKey || ''}
                      onChange={(e) => setConfigForm({ ...configForm, apiKey: e.target.value })}
                      placeholder="AIzaSy..."
                      className="w-full bg-slate-50 dark:bg-brand-surface2 border border-slate-300 dark:border-brand-border rounded-lg px-3 py-2 text-slate-900 dark:text-white font-mono focus:border-emerald-500 focus:outline-none"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-700 dark:text-slate-300 font-semibold mb-1">Auth Domain (authDomain)</label>
                      <input
                        type="text"
                        value={configForm.authDomain || ''}
                        onChange={(e) => setConfigForm({ ...configForm, authDomain: e.target.value })}
                        placeholder="kasir-toko-nurjanah.firebaseapp.com"
                        className="w-full bg-slate-50 dark:bg-brand-surface2 border border-slate-300 dark:border-brand-border rounded-lg px-3 py-2 text-slate-900 dark:text-white font-mono focus:border-emerald-500 focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-700 dark:text-slate-300 font-semibold mb-1">Project ID (projectId)</label>
                      <input
                        type="text"
                        required
                        value={configForm.projectId || ''}
                        onChange={(e) => setConfigForm({ ...configForm, projectId: e.target.value })}
                        placeholder="kasir-toko-nurjanah"
                        className="w-full bg-slate-50 dark:bg-brand-surface2 border border-slate-300 dark:border-brand-border rounded-lg px-3 py-2 text-slate-900 dark:text-white font-mono focus:border-emerald-500 focus:outline-none"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-700 dark:text-slate-300 font-semibold mb-1">Storage Bucket (storageBucket)</label>
                      <input
                        type="text"
                        value={configForm.storageBucket || ''}
                        onChange={(e) => setConfigForm({ ...configForm, storageBucket: e.target.value })}
                        placeholder="kasir-toko-nurjanah.firebasestorage.app"
                        className="w-full bg-slate-50 dark:bg-brand-surface2 border border-slate-300 dark:border-brand-border rounded-lg px-3 py-2 text-slate-900 dark:text-white font-mono focus:border-emerald-500 focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-700 dark:text-slate-300 font-semibold mb-1">App ID (appId)</label>
                      <input
                        type="text"
                        value={configForm.appId || ''}
                        onChange={(e) => setConfigForm({ ...configForm, appId: e.target.value })}
                        placeholder="1:109452166589:web:..."
                        className="w-full bg-slate-50 dark:bg-brand-surface2 border border-slate-300 dark:border-brand-border rounded-lg px-3 py-2 text-slate-900 dark:text-white font-mono focus:border-emerald-500 focus:outline-none"
                      />
                    </div>
                  </div>

                  <div className="pt-3 flex items-center justify-between border-t border-slate-200 dark:border-brand-border">
                    <button
                      type="button"
                      onClick={handleResetToDefaultConfig}
                      className="text-xs text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 underline cursor-pointer"
                    >
                      Reset ke Default (kasir-toko-nurjanah)
                    </button>
                    <div className="flex items-center gap-2">
                      <button
                        type="button"
                        onClick={() => setShowConfigModal(false)}
                        className="px-3.5 py-2 rounded-xl bg-slate-100 dark:bg-brand-surface2 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-semibold cursor-pointer"
                      >
                        Batal
                      </button>
                      <button
                        type="submit"
                        className="px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold shadow-md cursor-pointer"
                      >
                        Simpan &amp; Inisialisasi Ulang
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL WHATSAPP DRAFT */}
          {showWaModal && waTargetLicense && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-brand-surface border border-slate-200 dark:border-brand-border rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-slate-200 dark:border-brand-border pb-3">
                  <h3 className="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-2">
                    <IconWhatsApp className="w-4 h-4 text-emerald-500" />
                    Format Pesan WhatsApp untuk Kasir Pelanggan
                  </h3>
                  <button
                    onClick={() => setShowWaModal(false)}
                    className="text-slate-400 hover:text-slate-600 dark:hover:text-white p-1 rounded-lg cursor-pointer"
                  >
                    <IconX className="w-5 h-5" />
                  </button>
                </div>

                <div className="space-y-2">
                  <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300">
                    Nomor WhatsApp Pembeli (Opsional):
                  </label>
                  <div className="flex items-center gap-2">
                    <input
                      type="text"
                      value={waPhoneNumber}
                      onChange={(e) => setWaPhoneNumber(e.target.value)}
                      placeholder="Contoh: 6281234567890"
                      className="flex-1 bg-slate-50 dark:bg-brand-surface2 border border-slate-300 dark:border-brand-border rounded-xl px-3 py-2 text-xs text-slate-900 dark:text-white font-mono focus:border-emerald-500 focus:outline-none"
                    />
                    <button
                      type="button"
                      onClick={() => {
                        const phone = waPhoneNumber.replace(/[^0-9]/g, '');
                        const text = encodeURIComponent(getWhatsAppMessage(waTargetLicense));
                        const url = phone ? `https://wa.me/${phone}?text=${text}` : `https://wa.me/?text=${text}`;
                        window.open(url, '_blank');
                      }}
                      className="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs transition-colors shrink-0 flex items-center gap-1.5 cursor-pointer"
                    >
                      <IconWhatsApp className="w-3.5 h-3.5" />
                      <span>Kirim WA</span>
                    </button>
                  </div>
                </div>

                <textarea
                  rows={9}
                  readOnly
                  value={getWhatsAppMessage(waTargetLicense)}
                  className="w-full p-3 bg-slate-100 dark:bg-black/60 border border-slate-300 dark:border-brand-border rounded-xl font-mono text-xs text-slate-800 dark:text-slate-200 select-all focus:outline-none"
                />

                <div className="flex items-center justify-end gap-2 pt-2">
                  <button
                    onClick={() => setShowWaModal(false)}
                    className="px-3.5 py-2 rounded-xl bg-slate-100 dark:bg-brand-surface2 text-slate-700 dark:text-slate-300 text-xs font-semibold cursor-pointer"
                  >
                    Tutup
                  </button>
                  <button
                    onClick={() => {
                      copyToClipboard(getWhatsAppMessage(waTargetLicense), 'Format pesan WhatsApp disalin!');
                      setShowWaModal(false);
                    }}
                    className="px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-bold shadow-md cursor-pointer flex items-center gap-1.5"
                  >
                    <IconCopy className="w-3.5 h-3.5" />
                    Salin Teks
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL KONFIRMASI HAPUS LISENSI */}
          {showDeleteModal && licenseToDelete && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-brand-surface border border-rose-200 dark:border-rose-900/60 rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-4">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-rose-100 dark:bg-rose-950 text-rose-600 dark:text-rose-400 border border-rose-200 dark:border-rose-800 flex items-center justify-center shrink-0">
                    <IconTrash className="w-5 h-5 text-rose-600 dark:text-rose-400" />
                  </div>
                  <div>
                    <h4 className="text-sm font-bold text-slate-900 dark:text-white">Hapus Kode Lisensi?</h4>
                    <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Penghapusan permanen dari Cloud Firestore.</p>
                  </div>
                </div>

                <div className="p-2.5 rounded-xl bg-rose-50 dark:bg-black/50 border border-rose-200 dark:border-brand-border font-mono text-xs text-rose-600 dark:text-rose-300 font-bold tracking-wider text-center select-all">
                  {licenseToDelete.code}
                </div>

                <div className="flex items-center justify-end gap-2 pt-2 border-t border-slate-200 dark:border-brand-border">
                  <button
                    onClick={() => {
                      setShowDeleteModal(false);
                      setLicenseToDelete(null);
                    }}
                    className="px-3.5 py-1.5 rounded-lg bg-slate-100 dark:bg-brand-surface2 text-slate-700 dark:text-slate-300 text-xs font-semibold cursor-pointer"
                  >
                    Batal
                  </button>
                  <button
                    onClick={executeDeleteLicense}
                    className="px-4 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold shadow-md cursor-pointer"
                  >
                    Hapus Permanen
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* TOAST NOTIFIKASI */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 transform transition-all duration-300 px-4 py-3 rounded-xl bg-slate-900 text-white border border-emerald-500/80 shadow-2xl flex items-center gap-3 text-xs font-semibold">
              <IconCheckCircle className="w-4 h-4 text-emerald-400 shrink-0" />
              <span>{toastMessage}</span>
            </div>
          )}

        </div>
      );
    }

    // Inisialisasi React 18 Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

</body>
</html>
