  <!-- Polyfill Proteksi Property window.fetch untuk Mencegah Error Chrome Extension -->
  <script>
    (function () {
      // 1. Tangani error ekstensi Chrome secara global
      try {
        window.addEventListener('error', function (event) {
          if (
            (event.message && (event.message.indexOf('fetch') !== -1 || event.message.indexOf('getter') !== -1)) ||
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          var reason = String(event.reason || '');
          if (reason.indexOf('fetch') !== -1 || reason.indexOf('getter') !== -1 || reason.indexOf('chrome-extension') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      } catch (e) {}

      // 2. Proteksi properti window.fetch agar selalu memiliki getter & setter
      try {
        var _origFetch = (typeof window !== 'undefined' && window.fetch) ? window.fetch.bind(window) : null;
        var _currentFetch = _origFetch;
        var _fetchDesc = {
          get: function () {
            return _currentFetch;
          },
          set: function (newFetch) {
            _currentFetch = newFetch;
          },
          configurable: true,
          enumerable: true
        };

        try {
          var ownDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (ownDesc && !ownDesc.set && ownDesc.configurable) {
            delete window.fetch;
          }
        } catch (e) {}

        try {
          Object.defineProperty(window, 'fetch', _fetchDesc);
        } catch (e1) {}

        try {
          if (typeof Window !== 'undefined' && Window.prototype) {
            var protoDesc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
            if (protoDesc && !protoDesc.set && protoDesc.configurable) {
              delete Window.prototype.fetch;
            }
            Object.defineProperty(Window.prototype, 'fetch', _fetchDesc);
          }
        } catch (e2) {}
      } catch (err) {}
    })();
  </script>

      const logAudit = async (entry) => {

        const item = {

        if (db && connectionStatus.state === 'connected') {
          try {
            await db.collection('logs').doc(docId).set({
              ...item,
              timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
          } catch(e) {}
        }
      };

      // Hapus satu riwayat audit log dari Cloud Firestore & Cache Lokal
      const handleDeleteSingleLog = async (logItem) => {
        if (!logItem) return;
        const targetId = logItem.id;
        if (!targetId) return;

        // 1. Simpan ke local suppressed list agar langsung hilang dari tampilan & tidak muncul kembali
        addSuppressedLogId(targetId);
        setActivityLogs(prev => prev.filter(l => l.id !== targetId));

        // 2. Kirim perintah DELETE ke Cloud Firestore
        if (db && connectionStatus.state === 'connected') {
          try {
            await db.collection('logs').doc(targetId).delete();
            // Coba juga di activity_logs jika dokumen tercatat di sana
            try { await db.collection('activity_logs').doc(targetId).delete(); } catch(e) {}
            showToast(`Log aksi "${logItem.action || 'Aktivitas'}" berhasil dihapus dari Cloud Firestore /logs!`);
          } catch (err) {
            console.warn("Firestore delete rejected:", err);
            if (err.code === 'permission-denied' || String(err).includes('permission')) {
              setRulesNoticeModal({
                isOpen: true,
                message: `Log berhasil dihapus dari antarmuka panel, namun penghapusan di server Firebase ditolak oleh Firestore Security Rules (karena aturan match /logs/{logId} saat ini masih "allow delete: if false;").`,
                fixSnippet: `match /logs/{logId} {\n  allow read, write: if true; // Mengizinkan pembuatan & penghapusan riwayat audit log\n}`
              });
            } else {
              showToast(`Gagal menghapus dari Firestore: ${err.message}`);
            }
          }
        } else {
          showToast(`Log aksi "${logItem.action || 'Aktivitas'}" dihapus dari cache lokal`);
        }
        setLogToDelete(null);
      };

      // Bersihkan seluruh riwayat audit log di Cloud Firestore /logs & Cache Lokal
      const executeClearAllLogs = async () => {
        setIsClearingLogs(true);
        const totalCount = activityLogs.length;
        const allIds = activityLogs.map(l => l.id).filter(Boolean);
        
        allIds.forEach(id => addSuppressedLogId(id));
        setActivityLogs([]);

        if (db && connectionStatus.state === 'connected') {
          try {
            const snap = await db.collection('logs').get();
            let deletedCount = 0;
            let permissionBlocked = false;

            // Gunakan batch delete
            const batch = db.batch();
            snap.forEach(docSnap => {
              batch.delete(docSnap.ref);
            });

            try {
              await batch.commit();
              deletedCount = snap.size;
              showToast(`Berhasil membersihkan seluruh ${deletedCount} dokumen log di Cloud Firestore /logs!`);
            } catch (batchErr) {
              console.warn("Batch commit failed, attempting doc-by-doc:", batchErr);
              const results = await Promise.allSettled(snap.docs.map(d => d.ref.delete()));
              const successCount = results.filter(r => r.status === 'fulfilled').length;
              if (successCount > 0) {
                showToast(`${successCount} dokumen log berhasil dihapus di Cloud Firestore!`);
              } else {
                permissionBlocked = true;
              }
            }

            if (permissionBlocked) {
              setRulesNoticeModal({
                isOpen: true,
                message: `Seluruh riwayat log telah dibersihkan dari antarmuka panel admin, namun penghapusan dokumen di Cloud Firestore ditolak oleh Firestore Security Rules (permission-denied) karena aturan aturan /logs belum mengizinkan aksi delete.`,
                fixSnippet: `match /logs/{logId} {\n  allow read, write: if true; // Mengizinkan pembuatan & penghapusan riwayat audit log\n}`
              });
            }
          } catch (err) {
            console.warn("Clear all logs error:", err);
            showToast(`Log dibersihkan di panel lokal`);
          }
        } else {
          showToast(`Berhasil membersihkan ${totalCount} catatan log dari cache lokal`);
        }
        setIsClearingLogs(false);
        setShowClearLogsModal(false);
      };
      const handleToggleSuspend = async (store) => {
        const newStatus = store.accountStatus === 'suspended' ? 'active' : 'suspended';
        const storeId = store.storeId || store.id;

        // Optimistic UI update
        setStoresList(prev => prev.map(s => (s.storeId === storeId || s.id === storeId) ? { ...s, accountStatus: newStatus } : s));
        
        if (db && connectionStatus.state === 'connected') {
          try {
            await db.collection('stores').doc(storeId).set({
              accountStatus: newStatus,
              suspendedAt: newStatus === 'suspended' ? firebase.firestore.FieldValue.serverTimestamp() : null,
              suspendedBy: newStatus === 'suspended' ? 'Developer Admin' : null,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

            showToast(newStatus === 'suspended'

            showToast(`Gagal update status di Cloud Firestore: ${err.message}`);

        } else {
          showToast(`Status toko "${store.storeName}" diubah menjadi ${newStatus.toUpperCase()} (Lokal)`);
        }

        await logAudit({
          action: 'TOGGLE_SUSPEND',
          licenseCode: store.licenseCode || '-',
          targetStoreId: storeId,
          details: `Developer Admin mengubah accountStatus toko "${store.storeName}" menjadi "${newStatus.toUpperCase()}"`
        });
        setSuspendModalData(null);

        if (db && connectionStatus.state === 'connected') {
          try {
            const batch = db.batch();
            // 1. Update /licenses/{code}
            const licRef = db.collection('licenses').doc(code);
            batch.update(licRef, {
              status: 'cancelled',
              isUsed: false,
              cancelledAt: firebase.firestore.FieldValue.serverTimestamp(),
              cancelledBy: 'Developer Admin',
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()

            // 2. Update /stores/{targetStoreId} jika ada

                status_paket: 'cancelled',
                'license.status': 'cancelled',
                'license.cancelledAt': new Date().toISOString(),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()

            await batch.commit();
            showToast(`Paket lisensi ${code} berhasil DIBATALKAN di Cloud Firestore!`);
          } catch (err) {
            showToast(`Gagal update Firestore: ${err.message}`);
          }
        } else {
          showToast(`Lisensi ${code} dibatalkan (Mode Cache Lokal)`);
        }

        await logAudit({
          action: 'CANCEL_LICENSE',
          licenseCode: code,
          targetStoreId: targetStoreId,
          packageType: license.packageType,
          details: `Pembatalan paket lisensi ${code}. Status dokumen /licenses diubah menjadi "cancelled".`
        });
        setCancelModalData(null);

      // Generator kode lisensi unik
      const generateLicense = async (e) => {
        if (e) e.preventDefault();
        const prefix = packageType === 'premium' ? 'PREM' : 'BASE';
        const getB = () => Array.from({length: 4}, () => ALLOWED_CHARS[Math.floor(Math.random() * ALLOWED_CHARS.length)]).join('');

            id: code,
            code,
            licenseCode: code,
            packageType,
            durationDays: Number(durationDays),
            status: 'unused',
            isUsed: false,
            usedByStoreId: '',
            createdAt: new Date().toISOString()

        setLicenses(prev => [...newItems, ...prev]);

        if (db && connectionStatus.state === 'connected') {
          try {
            const batch = db.batch();
            newItems.forEach(item => {
              const ref = db.collection('licenses').doc(item.code);
              batch.set(ref, {
                ...item,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
              });
            });
            await batch.commit();
            showToast(`${quantity} Voucher lisensi berhasil disimpan di Firestore /licenses!`);
          } catch(err) {
            showToast(`Error: ${err.message}`);
          }
        } else {
          showToast(`${quantity} Voucher lisensi dibuat (Mode Cache Lokal)`);
        }

        for (const it of newItems) {
          await logAudit({
            action: 'GENERATE',
            licenseCode: it.code,
            packageType: it.packageType,
            durationDays: it.durationDays,
            details: `Membuat voucher ${it.packageType.toUpperCase()} (${it.durationDays} Hari)`
          });
        }

      // Hapus lisensi unused
      const executeDelete = async (code) => {
        setLicenses(prev => prev.filter(l => l.code !== code));
        if (db && connectionStatus.state === 'connected') {

          } catch(e) {
            showToast(`Gagal menghapus: ${e.message}`);

                  FP

                    <span className="text-[10px] px-2 py-0.5 rounded font-bold bg-emerald-100 dark:bg-emerald-950/80 text-emerald-700 dark:text-emerald-400 border border-emerald-300 dark:border-emerald-800">

                          type="button"
                          onClick={() => setShowRulesModal(true)}
                          className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-brand-surface2 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-300 dark:border-brand-border text-slate-700 dark:text-slate-300 font-semibold text-xs transition-colors cursor-pointer"
                          title="Lihat panduan aturan izin database firestore.rules"
                        >
                          <Icons.Shield className="w-3.5 h-3.5 text-emerald-500" />
                          <span>firestore.rules</span>
                        </button>
                        <span className="text-xs font-mono text-slate-400 font-semibold">{activityLogs.length} Catatan</span>
                        {activityLogs.length > 0 && (
                          <button
                            type="button"
                            onClick={() => setShowClearLogsModal(true)}
                            className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-rose-50 dark:bg-rose-950/60 hover:bg-rose-100 dark:hover:bg-rose-900/70 border border-rose-200 dark:border-rose-800/80 text-rose-700 dark:text-rose-300 font-bold text-xs transition-colors cursor-pointer shadow-sm"
                            title="Hapus seluruh riwayat list log di Cloud Firestore /logs & cache"
                          >
                            <Icons.Trash className="w-3.5 h-3.5 text-rose-500" />
                            <span>Bersihkan Semua Log</span>
                          </button>
                        )}
                      </div>
                    </div>

                    <div className="space-y-2 max-h-[500px] overflow-y-auto pr-1">
                      {activityLogs.length === 0 ? (
                        <div className="py-12 text-center text-xs text-slate-400 space-y-1">
                          <Icons.History className="w-8 h-8 text-slate-400 mx-auto opacity-50 mb-2" />
                          <div className="font-bold text-slate-600 dark:text-slate-300">Belum ada riwayat audit log.</div>
                          <p className="text-[11px] text-slate-500">Riwayat audit log bersih. Setiap aktivitas baru akan otomatis tercatat kembali.</p>
                        </div>
                      ) : (
                        activityLogs.map((log, idx) => (
                          <div key={log.id || idx} className="p-3.5 rounded-xl bg-slate-50 dark:bg-brand-surface2/50 border border-slate-200 dark:border-brand-border/60 flex items-center justify-between gap-3 text-xs hover:border-slate-300 dark:hover:border-slate-600 transition-colors">
                            <div className="space-y-1 flex-1 min-w-0">
                              <div className="flex items-center gap-2 flex-wrap">
                                <span className={`px-2 py-0.5 rounded font-mono font-bold text-[10px] ${
                                  log.action === 'TOGGLE_SUSPEND'
                                    ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30'
                                    : log.action === 'CANCEL_LICENSE'
                                    ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30'
                                    : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'
                                }`}>
                                  {log.action}
                                </span>
                                <span className="font-bold text-slate-800 dark:text-slate-200 truncate">{log.licenseCode || log.targetStoreId || '-'}</span>
                              </div>
                              <p className="text-slate-600 dark:text-slate-400 text-[11px] leading-relaxed break-words">{log.details}</p>
                            </div>
                            
                            <div className="flex items-center gap-2 shrink-0">
                              <span className="text-[10px] font-mono text-slate-400 hidden sm:inline">
                                {formatRelative(log.timestamp)}
                              </span>
                              
                              {/* Tombol Hapus per Baris di dalam kolom Riwayat Audit Aktivitas */}
                              <button
                                type="button"
                                onClick={() => handleDeleteSingleLog(log)}
                                className="p-1.5 rounded-lg bg-white dark:bg-brand-surface hover:bg-rose-100 dark:hover:bg-rose-950/80 border border-slate-200 dark:border-brand-border text-slate-400 hover:text-rose-500 transition-colors cursor-pointer"
                                title="Hapus catatan audit log ini dari Cloud Firestore /logs & cache"
                              >
                                <Icons.Trash className="w-3.5 h-3.5" />
                              </button>
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  </section>
                </div>
              )}

            </main>
          </div>

          {/* ============================================================== */}
          {/* MODAL KONFIRMASI SUSPEND (FITUR 2) */}
          {/* ============================================================== */}
          {suspendModalData && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-brand-surface border border-slate-200 dark:border-brand-border rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center gap-3">
                  <div className={`w-10 h-10 rounded-xl flex items-center justify-center shrink-0 ${
                    suspendModalData.accountStatus === 'suspended'
                      ? 'bg-emerald-500/20 text-emerald-500'
                      : 'bg-rose-500/20 text-rose-500'
                  }`}>
                    <Icons.Alert className="w-5 h-5" />
                  </div>
                  <div>
                    <h3 className="text-sm font-bold text-slate-900 dark:text-white">
                      {suspendModalData.accountStatus === 'suspended' ? 'Aktifkan Kembali Toko?' : 'Konfirmasi Suspend Toko?'}
                    </h3>
                    <p className="text-xs text-slate-500 dark:text-slate-400">
                      Toko: <strong>{suspendModalData.storeName}</strong> ({suspendModalData.storeId})
                    </p>
                  </div>
                </div>

                <p className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
                  {suspendModalData.accountStatus === 'suspended'
                    ? 'Toko akan diaktifkan kembali. Seluruh hak akses login kasir dan sinkronisasi data akan langsung pulih normal.'
                    : 'Jika di-suspend, aplikasi kasir toko ini akan terkunci secara real-time dan tidak dapat melakukan transaksi hingga diaktifkan kembali oleh Developer Admin.'}
                </p>

                <div className="flex items-center justify-end gap-2 pt-3 border-t border-slate-200 dark:border-brand-border">
                  <button
                    onClick={() => setSuspendModalData(null)}
                    className="px-4 py-2 rounded-xl bg-slate-100 dark:bg-brand-surface2 text-xs font-semibold text-slate-700 dark:text-slate-300"
                  >
                    Batal
                  </button>
                  <button
                    onClick={() => handleToggleSuspend(suspendModalData)}
                    className={`px-4 py-2 rounded-xl text-xs font-bold text-white shadow-lg ${
                      suspendModalData.accountStatus === 'suspended'
                        ? 'bg-emerald-600 hover:bg-emerald-500 shadow-emerald-600/30'
                        : 'bg-rose-600 hover:bg-rose-500 shadow-rose-600/30'
                    }`}
                  >
                    {suspendModalData.accountStatus === 'suspended' ? 'Ya, Aktifkan Toko' : 'Ya, Suspend Toko'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ============================================================== */}
          {/* MODAL KONFIRMASI BATALKAN PAKET (FITUR 3) */}
          {/* ============================================================== */}
          {cancelModalData && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-brand-surface border border-rose-500/30 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-rose-500/20 text-rose-500 flex items-center justify-center shrink-0">
                    <Icons.Alert className="w-5 h-5" />
                  </div>
                  <div>
                    <h3 className="text-sm font-bold text-slate-900 dark:text-white">Batalkan Paket Lisensi?</h3>
                    <p className="text-xs font-mono text-rose-400 mt-0.5">{cancelModalData.code}</p>
                  </div>
                </div>

                <p className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
                  Tindakan ini akan mengirim perintah pembaruan ke Cloud Firestore ke dokumen <code className="font-mono text-rose-400">/licenses/{cancelModalData.code}</code> dan mengubah status menjadi <strong>"cancelled"</strong>. Aplikasi kasir akan langsung mendeteksi pembatalan ini via real-time listener dan mencabut akses fitur paket.
                </p>

                <div className="flex items-center justify-end gap-2 pt-3 border-t border-slate-200 dark:border-brand-border">
                  <button
                    onClick={() => setCancelModalData(null)}
                    className="px-4 py-2 rounded-xl bg-slate-100 dark:bg-brand-surface2 text-xs font-semibold text-slate-700 dark:text-slate-300"
                  >
                    Batal
                  </button>
                  <button
                    onClick={() => handleCancelLicense(cancelModalData)}
                    className="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-xs font-bold text-white shadow-lg shadow-rose-600/30"
                  >
                    Konfirmasi Batalkan Paket
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ============================================================== */}
          {/* MODAL CONFIG FIREBASE */}
          {/* ============================================================== */}
          {showConfigModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-brand-surface border border-slate-200 dark:border-brand-border rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-slate-200 dark:border-brand-border pb-3">
                  <h3 className="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-2">
                    <Icons.Settings className="w-4 h-4 text-emerald-500" />
                    Konfigurasi Cloud Firestore FortaPOS
                  </h3>
                  <button onClick={() => setShowConfigModal(false)} className="text-slate-400 hover:text-white">
                    <Icons.X className="w-4 h-4" />
                  </button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 font-semibold mb-1">Project ID</label>
                    <input
                      type="text"
                      value={configForm.projectId || ''}
                      onChange={(e) => setConfigForm({ ...configForm, projectId: e.target.value })}
                      className="w-full bg-slate-50 dark:bg-brand-surface2 border border-slate-300 dark:border-brand-border rounded-xl px-3 py-2 text-slate-900 dark:text-white font-mono"
                    />
                  </div>
                  <div>
                    <label className="block text-slate-400 font-semibold mb-1">API Key</label>
                    <input
                      type="text"
                      value={configForm.apiKey || ''}
                      onChange={(e) => setConfigForm({ ...configForm, apiKey: e.target.value })}
                      className="w-full bg-slate-50 dark:bg-brand-surface2 border border-slate-300 dark:border-brand-border rounded-xl px-3 py-2 text-slate-900 dark:text-white font-mono"
                    />
                  </div>
                </div>

                <div className="flex items-center justify-end gap-2 pt-3 border-t border-slate-200 dark:border-brand-border">
                  <button
                    onClick={() => setShowConfigModal(false)}
                    className="px-4 py-2 rounded-xl bg-slate-100 dark:bg-brand-surface2 text-xs font-semibold text-slate-700 dark:text-slate-300"
                  >
                    Batal
                  </button>
                  <button
                    onClick={() => {
                      setFirebaseConfig(configForm);
                      localStorage.setItem('fortapos_firebase_config', JSON.stringify(configForm));
                      setShowConfigModal(false);
                      showToast("Konfigurasi disimpan!");
                    }}
                    className="px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs"
                  >
                    Simpan &amp; Hubungkan
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ============================================================== */}
          {/* MODAL KONFIRMASI HAPUS SEMUA LOG */}
          {/* ============================================================== */}
          {showClearLogsModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-brand-surface border border-rose-500/30 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-rose-500/20 text-rose-500 flex items-center justify-center shrink-0">
                    <Icons.Trash className="w-5 h-5" />
                  </div>
                  <div>
                    <h3 className="text-sm font-bold text-slate-900 dark:text-white">
                      Bersihkan Seluruh Riwayat Audit Log?
                    </h3>
                    <p className="text-xs text-slate-500 dark:text-slate-400">
                      Total {activityLogs.length} catatan riwayat log akan dihapus permanen.
                    </p>
                  </div>
                </div>

                <p className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
                  Tindakan ini akan menghapus seluruh dokumen riwayat audit di koleksi Cloud Firestore <code className="font-mono text-rose-400">/logs</code> serta membersihkan penyimpanan cache lokal. Data yang sudah dihapus tidak dapat dipulihkan kembali.
                </p>

                <div className="flex items-center justify-end gap-2 pt-3 border-t border-slate-200 dark:border-brand-border">
                  <button
                    onClick={() => setShowClearLogsModal(false)}
                    disabled={isClearingLogs}
                    className="px-4 py-2 rounded-xl bg-slate-100 dark:bg-brand-surface2 text-xs font-semibold text-slate-700 dark:text-slate-300 cursor-pointer"
                  >
                    Batal
                  </button>
                  <button
                    onClick={executeClearAllLogs}
                    disabled={isClearingLogs}
                    className="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-xs font-bold text-white shadow-lg shadow-rose-600/30 flex items-center gap-1.5 cursor-pointer disabled:opacity-50"
                  >
                    {isClearingLogs ? (
                      <>
                        <div className="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin" />
                        <span>Menghapus...</span>
                      </>
                    ) : (
                      <>
                        <Icons.Trash className="w-3.5 h-3.5" />
                        <span>Ya, Hapus Semua Log</span>
                      </>
                    )}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ============================================================== */}
          {/* MODAL PANDUAN FIRESTORE RULES */}
          {/* ============================================================== */}
          {showRulesModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-brand-surface border border-slate-200 dark:border-brand-border rounded-2xl max-w-xl w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-slate-200 dark:border-brand-border pb-3">
                  <div className="flex items-center gap-2">
                    <Icons.Shield className="w-5 h-5 text-emerald-500" />
                    <h3 className="text-sm font-bold text-slate-900 dark:text-white">
                      Panduan Aturan Keamanan Database (firestore.rules)
                    </h3>
                  </div>
                  <button onClick={() => setShowRulesModal(false)} className="text-slate-400 hover:text-white cursor-pointer">
                    <Icons.X className="w-5 h-5" />
                  </button>
                </div>

                <p className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
                  Agar fitur penghapusan log audit, pembuatan lisensi, dan suspend toko dapat berjalan penuh ke database Cloud Firestore proyek <code className="font-mono text-emerald-500 font-bold">{firebaseConfig.projectId}</code>, pastikan aturan keamanan di Firebase Console mengizinkan operasi <code className="font-mono text-cyan-400 font-bold">write</code> pada koleksi <code className="font-mono text-emerald-400 font-bold">/logs</code>:
                </p>

                <pre className="p-3 bg-slate-900 text-emerald-400 rounded-xl font-mono text-[11px] overflow-x-auto select-all leading-relaxed border border-slate-800">
                  {RECOMMENDED_RULES}
                </pre>

                <div className="flex items-center justify-between pt-2">
                  <div className="text-[11px] text-slate-400">
                    Buka menu: <strong>Firestore Database &gt; Rules</strong> lalu Publish.
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => setShowRulesModal(false)}
                      className="px-3.5 py-1.5 rounded-lg bg-slate-100 dark:bg-brand-surface2 text-slate-700 dark:text-slate-300 text-xs font-semibold cursor-pointer"
                    >
                      Tutup
                    </button>
                    <button
                      onClick={() => copyToClipboard(RECOMMENDED_RULES, 'firestore.rules disalin!')}
                      className="px-3.5 py-1.5 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs cursor-pointer flex items-center gap-1.5 shadow-sm"
                    >
                      <Icons.Copy className="w-3.5 h-3.5" />
                      <span>Salin Rules</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ============================================================== */}
          {/* MODAL PERINGATAN IZIN RULES SAAT HAPUS LOG (PERMISSION-DENIED) */}
          {/* ============================================================== */}
          {rulesNoticeModal.isOpen && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-brand-surface border border-amber-500/40 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center gap-3 border-b border-slate-200 dark:border-brand-border pb-3">
                  <div className="w-10 h-10 rounded-xl bg-amber-500/20 text-amber-500 flex items-center justify-center shrink-0">
                    <Icons.Alert className="w-5 h-5" />
                  </div>
                  <div>
                    <h3 className="text-sm font-bold text-slate-900 dark:text-white">
                      Pembaruan Izin Firestore Rules Diperlukan
                    </h3>
                    <p className="text-xs text-amber-600 dark:text-amber-400 mt-0.5">
                      Database menolak perintah delete karena aturan koleksi /logs
                    </p>
                  </div>
                </div>

                <p className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
                  {rulesNoticeModal.message}
                </p>

                <div className="p-3 rounded-xl bg-slate-900 border border-slate-800 space-y-2">
                  <div className="flex items-center justify-between text-[11px] text-slate-400 font-mono">
                    <span>Aturan yang perlu diubah di Firebase Console:</span>
                    <button
                      type="button"
                      onClick={() => copyToClipboard(rulesNoticeModal.fixSnippet || RECOMMENDED_RULES, 'Aturan disalin!')}
                      className="text-emerald-400 hover:underline flex items-center gap-1 cursor-pointer font-bold"
                    >
                      <Icons.Copy className="w-3 h-3" />
                      <span>Salin Aturan</span>
                    </button>
                  </div>
                  <pre className="text-emerald-400 font-mono text-[11px] overflow-x-auto select-all">
                    {rulesNoticeModal.fixSnippet || `match /logs/{logId} {\n  allow read, write: if true;\n}`}
                  </pre>
                </div>

                <div className="text-[11px] text-slate-500 dark:text-slate-400 leading-relaxed">
                  <strong>Status Data:</strong> Log telah disembunyikan secara bersih dari tampilan panel admin ini dan tidak akan muncul kembali. Setelah aturan rules diperbarui di Firebase Console, penghapusan di cloud akan langsung berhasil 100%.
                </div>

                <div className="flex items-center justify-end gap-2 pt-2 border-t border-slate-200 dark:border-brand-border">
                  <button
                    onClick={() => setRulesNoticeModal({ isOpen: false, message: '', fixSnippet: '' })}
                    className="px-4 py-2 rounded-xl bg-slate-100 dark:bg-brand-surface2 text-xs font-semibold text-slate-700 dark:text-slate-300 cursor-pointer"
                  >
                    Tutup
                  </button>
                  <button
                    onClick={() => {
                      copyToClipboard(RECOMMENDED_RULES, 'Seluruh firestore.rules disalin!');
                      setRulesNoticeModal({ isOpen: false, message: '', fixSnippet: '' });
                    }}
                    className="px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs shadow-md shadow-emerald-500/20 cursor-pointer"
                  >
                    Salin Seluruh Aturan Rules
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* TOAST NOTIFIKASI */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 px-4 py-3 rounded-xl bg-slate-900 text-white border border-emerald-500 shadow-2xl flex items-center gap-2 text-xs font-semibold">
              <Icons.Check className="w-4 h-4 text-emerald-400 shrink-0" />
              <span>{toastMessage}</span>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
