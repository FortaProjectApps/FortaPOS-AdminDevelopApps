service cloud.firestore {
  match /databases/{database}/documents {
    match /licenses/{licenseCode} {
      // Izinkan pembacaan kode lisensi
      allow read: if true;
      
      // Developer terautentikasi atau sistem kasir dapat membuat voucher
      allow create: if request.auth != null || true;
      
      // Kasir mengklaim lisensi (mengisi usedByStoreId dengan UID Owner)
      allow update: if true;
      
      // Hanya lisensi yang belum terpakai (isUsed == false) yang boleh dihapus
      allow delete: if resource.data.isUsed == false;
    }

    // Koleksi riwayat audit aktivitas lisensi (License Activity Logs)
    match /logs/{logId} {
      allow read: if true;
      allow create: if true;
      allow update, delete: if false; // Immutable audit log
    }

    // Koleksi pengaturan harga paket FortaPOS (dibaca oleh kasir & diedit oleh admin)
    match /settings/{document=**} {
      allow read: if true;
      allow write: if true;
    }

    // Koleksi Toko & Kehadiran Owner (Real-Time Presence & Lisensi Aktif)
    match /stores/{storeId} {
      allow read: if true;
      allow write: if request.auth != null || true;
      match /{subcollection=**} {
        allow read, write: if request.auth != null || true;
      }
    }

    match /owners/{ownerId} {
      allow read: if true;
      allow write: if request.auth != null || true;
    }

    // Koleksi Global Real-Time Activity Logs (Transaksi, Stok, Login Kasir)
    match /activity_logs/{activityId} {
      allow read: if true;
      allow create: if true;
      allow update, delete: if request.auth != null || true;
    }
  }
}`;

      // Generator Kode Lisensi Unik
      function generateLicenseCode(pkg) {
        const prefix = (pkg === 'premium') ? 'PREM' : 'BASE';
        const getBlock = () => {
          let b = '';
          for (let i = 0; i < 4; i++) {
            b += ALLOWED_CHARS[Math.floor(Math.random() * ALLOWED_CHARS.length)];

        };
        return `${prefix}-${getBlock()}-${getBlock()}-${getBlock()}`;

      //   status: "unused" | "active", isUsed, activatedByStoreId, usedByStoreId,
      //   createdAt, activatedAt, expiryDate, expiresAt }

                action: 'GENERATE',
                licenseCode: item.code,
                packageType: item.packageType,
                durationDays: item.durationDays,
                performedBy: 'Developer (Admin)',
                performedByRole: 'developer',
                details: `Membuat voucher baru paket ${item.packageType.toUpperCase()} (${item.durationDays} Hari) [Cache Lokal]`

              licenseCode: item.code,
              packageType: item.packageType,
              durationDays: item.durationDays,
              performedBy: 'Developer (Admin)',
              performedByRole: 'developer',

      // Filter Data Tabel

      // Salin Teks ke Clipboard

            () => showToast(msg),
            () => fallbackCopyText(text, msg)
          );
        } else {
          fallbackCopyText(text, msg);
        }
      };

      const fallbackCopyText = (text, msg) => {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.left = "-999999px";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
          document.execCommand('copy');
          showToast(msg);
        } catch (err) {

        document.body.removeChild(textArea);

                  <button
                    onClick={executeDelete}
                    className="px-4 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold shadow-md shadow-rose-950/50 flex items-center gap-1.5 active:scale-95 cursor-pointer"
                  >
                    <IconTrash className="w-3.5 h-3.5" />
                    <span>Hapus Permanen</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL SIMULASI KLAIM LISENSI KASIR */}
          {showClaimModal && licenseToClaim && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-brand-surface border border-slate-200 dark:border-brand-border rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-4">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-cyan-100 dark:bg-cyan-950 text-cyan-600 dark:text-cyan-400 border border-cyan-200 dark:border-cyan-800 flex items-center justify-center shrink-0">
                    <IconStore className="w-5 h-5 text-cyan-600 dark:text-cyan-400" />
                  </div>
                  <div>
                    <h4 className="text-sm font-bold text-slate-900 dark:text-white">Simulasi Klaim Lisensi Kasir</h4>
                    <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                      Tes aktivasi multi-tenant dengan Firebase Auth UID Owner
                    </p>
                  </div>
                </div>

                <div className="p-2 rounded-xl bg-slate-100 dark:bg-black/50 border border-slate-200 dark:border-brand-border font-mono text-xs text-cyan-600 dark:text-cyan-300 font-bold tracking-wider text-center select-all">
                  {licenseToClaim.code}
                </div>

                <div className="space-y-1.5">
                  <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300">
                    UID Firebase Auth Milik Owner Toko:
                  </label>
                  <input
                    type="text"
                    value={simulatedOwnerUid}
                    onChange={(e) => setSimulatedOwnerUid(e.target.value)}
                    placeholder="Contoh: u9x8L1p0KzQw7..."
                    className="w-full bg-slate-50 dark:bg-brand-surface2 border border-slate-300 dark:border-brand-border rounded-xl px-3 py-2 text-xs text-slate-900 dark:text-white font-mono focus:border-emerald-500 focus:outline-none"
                  />
                  <p className="text-[10px] text-slate-400 dark:text-slate-400">
                    Field <code className="font-mono">usedByStoreId</code> diisi UID ini, <code className="font-mono">activatedAt</code> dicatat saat ini, dan <code className="font-mono">expiresAt</code> dihitung ({licenseToClaim.durationDays} hari ke depan).
                  </p>
                </div>

                <div className="flex items-center justify-end gap-2 pt-2 border-t border-slate-200 dark:border-brand-border">
                  <button
                    onClick={() => {
                      setShowClaimModal(false);
                      setLicenseToClaim(null);
                    }}
                    className="px-3.5 py-1.5 rounded-lg bg-slate-100 dark:bg-brand-surface2 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 text-xs font-semibold cursor-pointer"
                  >
                    Batal
                  </button>
                  <button
                    onClick={executeClaim}
                    className="px-4 py-1.5 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold shadow-md shadow-cyan-950/50 flex items-center gap-1.5 active:scale-95 cursor-pointer"
                  >
                    <span>Aktivasi Lisensi</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* TOAST NOTIFIKASI */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 transform transition-all duration-300 px-4 py-3 rounded-xl bg-slate-900 dark:bg-slate-900 text-white border border-emerald-500/80 shadow-2xl flex items-center gap-3 text-xs font-semibold">
              <IconCheckCircle className="w-4 h-4 text-emerald-400 shrink-0" />
              <span>{toastMessage}</span>
            </div>
          )}

        </div>
      );
    }

    // ==========================================
    // INISIALISASI ROOT DENGAN METODE MODERN REACT 18
    // ==========================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

</body>
</html>
